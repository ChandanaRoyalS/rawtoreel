name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  end-to-end:
    name: raw clip -> youtube + reels
    runs-on: ubuntu-latest
    needs: unit
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: system packages (ffmpeg, fonts for captions)
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core

      - name: python + node dependencies
        run: |
          pip install -e . piper-tts
          npm ci --no-audit --no-fund

      - name: cache models (whisper + piper voice)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/piper
          key: models-${{ runner.os }}-whisper-small-lessac-medium

      - name: headless chrome for HyperFrames
        run: npx hyperframes browser ensure

      - name: 0. make a synthetic raw clip (piper TTS, with fillers + a restart + pauses)
        run: rawtoreel sample --out sample/sample.mp4

      - name: 1. intake
        run: rawtoreel intake sample sample/sample.mp4 --title "rawtoreel, end to end" --speaker "rawtoreel" --role "CI run"

      - name: 2-7. youtube (16:9, graphics, music, export)
        run: rawtoreel run sample --format youtube --music

      - name: 3,5,7. reels variant (9:16, burned captions)
        run: |
          rawtoreel step 3 sample --format reels
          rawtoreel step 5 sample --format reels
          rawtoreel step 7 sample --format reels

      - name: job summary (what the cut removed)
        run: |
          {
            echo "## rawtoreel run"
            echo
            echo '```'
            rawtoreel status sample
            echo '```'
            echo
            echo "### Removed by the rough cut"
            python - <<'PY'
          import json
          cl = json.load(open("projects/sample/cutlist.json"))
          print(f"raw {cl['duration_raw']}s -> cut {cl['duration_cut']}s\n")
          print("| start | end | reason | text |\n|---|---|---|---|")
          for r in cl["removed"]:
              print(f"| {r['start']} | {r['end']} | {r['reason']} | {r['text']} |")
          PY
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: rawtoreel-outputs
          path: |
            outputs/*.mp4
            outputs/*.jpg
            outputs/*.json
            projects/sample/cutlist.json
            projects/sample/script.md
            projects/sample/graphics-plan.json
            projects/sample/captions.reels.ass
          retention-days: 30
